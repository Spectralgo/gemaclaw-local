name: Release desktop app

# Tag a version (v0.2.0) → build the unsigned arm64 bundle → attach the
# zip to a GitHub Release. Gema's settings card links members to the
# releases page as the download path.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:dist
      - name: Create release with artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "GemaClaw Local ${GITHUB_REF_NAME}" \
            --generate-notes \
            $([[ "${GITHUB_REF_NAME}" == *-* ]] && echo --prerelease)
